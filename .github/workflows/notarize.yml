name: Notarize

# DISABLED until you enable it. release.yml still cuts every tag as an ad-hoc build; nothing here
# runs on a tag push, and the job is gated on a repository VARIABLE so a manual "Run workflow" click
# is a no-op (skipped, not failed) until you flip it. When enabled it rebuilds GoTab.app, re-signs it
# with a Developer ID Application certificate + the hardened runtime, submits it to Apple's notary
# service, staples the ticket, and REPLACES that release's GoTab-<tag>.zip / .sha256 with the
# notarized build — so the `curl | bash` installer and the download link then serve a bundle that
# launches with no Gatekeeper prompt and needs no quarantine strip.
#
# To enable (repo → Settings → Secrets and variables → Actions):
#
#   1. Variables tab → New repository variable:
#        NOTARIZATION_ENABLED = true          # the on/off switch this job's `if:` checks
#
#   2. Secrets tab → New repository secret (all five):
#        APPLE_CERT_P12_BASE64   base64 of a "Developer ID Application" cert exported as .p12
#                                  (`base64 -i cert.p12 | pbcopy`)
#        APPLE_CERT_PASSWORD     the .p12 export password
#        APPLE_TEAM_ID           your 10-character Team ID
#        APPLE_NOTARY_USER       an Apple ID with notarization access
#        APPLE_NOTARY_PASSWORD   an app-specific password for that Apple ID
#                                  (appleid.apple.com → Sign-In and Security → App-Specific Passwords)
#
#   3. Then: Actions → Notarize → Run workflow, tag = the release to notarize.
#
# Cost: an Apple Developer Program membership ($99/yr). See docs/DECISIONS.md D60; running this once
# closes the Gatekeeper half of V6.7. To make it automatic later, add `release: { types: [published] }`
# to `on:` below (the `if:` gate still protects it until the variable is set).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to notarize (e.g. v1.0.2)"
        required: true

permissions: {}

jobs:
  notarize:
    # The kill switch. Skipped (not failed) until you create the repository variable
    # NOTARIZATION_ENABLED = true. See this file's header.
    if: ${{ vars.NOTARIZATION_ENABLED == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write # gh release upload --clobber
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Preflight — the Apple secrets must be set
        env:
          C: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P: ${{ secrets.APPLE_CERT_PASSWORD }}
          T: ${{ secrets.APPLE_TEAM_ID }}
          U: ${{ secrets.APPLE_NOTARY_USER }}
          W: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          missing=
          for v in C P T U W; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Apple Developer secrets not set — missing:$missing. See this file's header."
            exit 1
          fi
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tag must look like v1.2.3 (got '$TAG')"; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/gotab-signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          kp="$(uuidgen)"
          security create-keychain -p "$kp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$kp" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning "$KEYCHAIN" \
               | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$id" ] || { echo "::error::the .p12 has no 'Developer ID Application' identity"; exit 1; }
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Build GoTab.app at the tag's version
        run: |
          short="${TAG#v}"
          GOTAB_SHORT_VERSION="$short" ./scripts/build.sh

      - name: Re-sign with Developer ID + hardened runtime
        run: |
          app=build/GoTab.app
          # Hardened runtime (--options runtime) is a notarization requirement. Sign the nested
          # Mach-O first, then the bundle, then verify. The weak-linked ScreenCaptureKit is an
          # Apple-signed system framework, so library validation (on by default under the hardened
          # runtime) is satisfied without a disable-library-validation entitlement.
          find "$app/Contents/MacOS" -type f -perm -u+x -print0 \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" {}
          codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Timestamp|flags'

      - name: Notarize, staple, re-package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          NOTARY_PW: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          # ditto, like release.yml, so the signature and xattrs survive the round trip.
          ditto -c -k --keepParent build/GoTab.app "GoTab-$TAG.zip"
          xcrun notarytool submit "GoTab-$TAG.zip" \
            --apple-id "$NOTARY_USER" --team-id "$TEAM_ID" --password "$NOTARY_PW" \
            --wait --timeout 30m
          xcrun stapler staple build/GoTab.app
          rm -f "GoTab-$TAG.zip"
          ditto -c -k --keepParent build/GoTab.app "GoTab-$TAG.zip"
          shasum -a 256 "GoTab-$TAG.zip" | tee "GoTab-$TAG.zip.sha256"
          # Informational: Gatekeeper's verdict on the stapled bundle. "accepted" / "source=Notarized
          # Developer ID" is the goal.
          spctl -a -vvv -t install build/GoTab.app || true
          stapler validate build/GoTab.app

      - name: Replace the release's assets with the notarized build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "GoTab-$TAG.zip" "GoTab-$TAG.zip.sha256" --clobber

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
