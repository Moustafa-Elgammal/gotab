name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Must be macOS: the platform layer is cgo against AppKit and CoreGraphics.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Gate (gofmt, vet, tests, architecture invariants)
        run: ./scripts/check.sh

      - name: Build the app bundle
        run: ./scripts/build.sh

      - name: Roadmap was updated
        # A commit that changes code without recording it in ROADMAP.md is how this project
        # loses track of itself. Warn rather than fail: some commits are legitimately docs-only.
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '\.go$'; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'docs/ROADMAP.md' \
              || echo "::warning::Go code changed but docs/ROADMAP.md did not. See AGENTS.md#workflow."
          fi
